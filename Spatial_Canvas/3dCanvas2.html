<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Spatial Canvas</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05030f;
    }

    #threejs-container-2 {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #05030f;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="threejs-container-2"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

  <!-- your own JS file -->
  <script src="3dCanvas2.js"></script>
</body>
</html>
